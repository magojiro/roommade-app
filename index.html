<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F7F3EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>RoomMade — US Consumer App</title>
<style>
  /* self-hosted fonts — same faces v1 declared, downloaded locally so it
     renders identically inside WeChat without any third-party font CDN */
  @font-face{font-family:'Fraunces';font-style:normal;font-weight:100 900;font-display:swap;
    src:url('assets/fonts/Fraunces-var.woff2') format('woff2')}
  @font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;
    src:url('assets/fonts/Inter-var.woff2') format('woff2')}
  @font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;font-display:swap;
    src:url('assets/fonts/IBMPlexMono-400.ttf') format('truetype')}

  :root{
    --serif:"Fraunces","Iowan Old Style",Georgia,serif;
    --sans:"Inter",system-ui,-apple-system,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,monospace;
    --paper:#F7F3EC;
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{height:100%}
  body{
    background:var(--paper);color:#1A1815;font-family:var(--sans);
    -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
    min-height:100%;
  }
  img{display:block;max-width:100%}
  button{font-family:inherit;border:0;background:none;padding:0;cursor:pointer;color:inherit;
    -webkit-tap-highlight-color:transparent}
  input,textarea{font-family:inherit}
  ::selection{background:rgba(110,31,46,.16)}

  /* hide scrollbars like v1's .rm-scroll / .rm-scroll-x helpers */
  .rm-scroll{scrollbar-width:none;-ms-overflow-style:none}
  .rm-scroll::-webkit-scrollbar{display:none;width:0;height:0}
  .rm-scroll-x{scrollbar-width:none;-ms-overflow-style:none}
  .rm-scroll-x::-webkit-scrollbar{display:none;height:0}

  /* v1 animations, carried over verbatim */
  @keyframes rmScan{0%{top:6%;opacity:0}12%{opacity:1}88%{opacity:1}100%{top:94%;opacity:0}}
  .rm-scan{animation:rmScan 1.9s ease-in-out infinite}
  @keyframes rmPulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
  .rm-pulse{animation:rmPulse 1.1s ease-in-out infinite}
  @keyframes rmDot{0%,100%{opacity:.25}50%{opacity:.9}}
  .rm-dot{animation:rmDot 1.2s ease-in-out infinite}
  @keyframes rmFadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .rm-fade{animation:rmFadeUp .32s cubic-bezier(.2,.7,.2,1) both}
  @media (prefers-reduced-motion:reduce){
    .rm-scan,.rm-pulse,.rm-dot,.rm-fade{animation:none!important}
  }

  /* ── phone, full bleed (the real phone experience) ───────────── */
  .rm-fullbleed{position:fixed;inset:0;height:100dvh;display:flex;flex-direction:column;
    background:var(--paper);overflow:hidden}
  .rm-fullbleed-stage{flex:1;min-height:0;min-width:0;width:100%;display:flex;flex-direction:column;isolation:isolate}
  .rm-fullbleed-stage > *{min-width:0;min-height:0;width:100%;max-width:100%}

  /* ── desktop review shell ─────────────────────────────────────── */
  .rm-desk{min-height:100vh;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:22px;padding:44px 24px 40px;
    background:#EFE7DA;
    background-image:radial-gradient(rgba(28,25,22,.11) .7px,transparent .7px);
    background-size:22px 22px}
  .rm-desk-phone{filter:drop-shadow(0 26px 44px rgba(28,25,22,.2))}
  .rm-desk-dock{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:100px;
    background:rgba(247,243,236,.86);border:1px solid rgba(28,25,22,.12);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .rm-step{width:28px;height:28px;border-radius:100px;border:1px solid rgba(28,25,22,.18);
    display:flex;align-items:center;justify-content:center;flex:none;transition:opacity .15s}
  .rm-step:disabled{opacity:.3}
  .rm-step:active{background:rgba(28,25,22,.05)}
  .rm-desk-meta{display:flex;align-items:baseline;gap:7px;min-width:0;max-width:260px}
  .rm-desk-id{font-family:var(--mono);font-size:9px;letter-spacing:.04em;color:rgba(28,25,22,.42)}
  .rm-desk-name{font-size:11.5px;color:rgba(28,25,22,.72);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis}
  .rm-desk-count{font-family:var(--mono);font-size:9px;color:rgba(28,25,22,.34);flex:none}

  @media (max-width:559px){
    .rm-desk{display:none}
  }
  @media (min-width:560px){
    .rm-fullbleed{display:none}
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>

<script src="build/ios-frame.js"></script>
<script src="build/ui.js"></script>
<script src="build/data.js"></script>
<script src="build/data-pro.js"></script>
<script src="build/pro-ui.js"></script>
<script src="build/a.js"></script>
<script src="build/b.js"></script>
<script src="build/c.js"></script>
<script src="build/d.js"></script>
<script src="build/pro-entry.js"></script>
<script src="build/pro-ops.js"></script>
<script src="build/app.js"></script>

<script>
  (function boot(){
    var tries = 0;
    function start(){
      tries++;
      if (!window.RMApp || !window.IOSDevice || !window.RM_COMPONENTS) {
        if (tries < 200) return setTimeout(start, 30);
        return;
      }
      var root = document.getElementById('root');
      ReactDOM.createRoot(root).render(React.createElement(window.RMApp));
    }
    start();
  })();
</script>
</body>
</html>
